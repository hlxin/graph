# A release: pushing a tag vX.Y.Z (the version in pyproject.toml) runs the tests, builds the sdist and wheel, and
# publishes them to PyPI by trusted publishing (no token: PyPI trusts this workflow in the `pypi` environment).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the test and build tools
        run: python -m pip install pytest networkx jsonschema numpy build
      - name: The tag names the package's version
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "${GITHUB_REF_NAME#v}" = "$version" || { echo "tag $GITHUB_REF_NAME, pyproject $version"; exit 1; }
      - name: Runtime tests
        run: python -m pytest -q
      - name: Build
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
